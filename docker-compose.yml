version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: vyapar_backend
    command: ["/app/entrypoint.sh"]
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vyapar_frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vyapar_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static
      - media_data:/media
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  - sqlite_data:/app/data
  - media_data:/app/media
  - static_data:/app/staticfiles